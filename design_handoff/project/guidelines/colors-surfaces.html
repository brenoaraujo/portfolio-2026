<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);padding:20px 24px}.row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:96px;height:60px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.lab{font-size:11px;letter-spacing:-.02em;color:var(--text-secondary);font-family:var(--font-mono)}.nm{font-size:12px;color:var(--text-primary);letter-spacing:-.03em}</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:rgb(253,251,250)"></div><div class="nm">Paper</div><div class="lab">--surface-page</div></div>
<div class="sw"><div class="chip" style="background:rgb(255,255,255)"></div><div class="nm">White</div><div class="lab">--surface-card</div></div>
<div class="sw"><div class="chip" style="background:rgb(245,245,245)"></div><div class="nm">Gray 100</div><div class="lab">--background-secondary</div></div>
<div class="sw"><div class="chip" style="background:rgba(0,0,0,0.05)"></div><div class="nm">Overlay 5%</div><div class="lab">--surface-overlay</div></div>
</div></body></html>
