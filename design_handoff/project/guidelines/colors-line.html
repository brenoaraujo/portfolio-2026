<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);padding:20px 24px}.row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:96px;height:60px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.lab{font-size:11px;letter-spacing:-.02em;color:var(--text-secondary);font-family:var(--font-mono)}.nm{font-size:12px;color:var(--text-primary);letter-spacing:-.03em}</style></head><body>
<div style="display:flex;gap:24px;align-items:center">
<div class="sw"><div class="chip" style="background:rgb(212,212,212)"></div><div class="nm">Line</div><div class="lab">--border-hairline</div></div>
<div style="flex:1;display:flex;flex-direction:column;gap:14px">
<div><div class="lab" style="margin-bottom:8px">0.5px rule — header, list rows</div><div style="height:0;box-shadow:inset 0 0 0 .5px rgb(212,212,212),0 0 0 .5px rgb(212,212,212)"></div></div>
<div><div class="lab" style="margin-bottom:8px">1px inset — image plate, radius 12</div><div style="height:44px;border-radius:12px;box-shadow:inset 0 0 0 1px rgb(212,212,212)"></div></div>
</div></div></body></html>
