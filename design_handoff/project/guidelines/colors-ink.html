<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);padding:20px 24px}.row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:96px;height:60px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.lab{font-size:11px;letter-spacing:-.02em;color:var(--text-secondary);font-family:var(--font-mono)}.nm{font-size:12px;color:var(--text-primary);letter-spacing:-.03em}</style></head><body><div class="row">
<div class="sw"><div class="chip" style="background:rgb(0,0,0)"></div><div class="nm">Black</div><div class="lab">--text-primary</div></div>
<div class="sw"><div class="chip" style="background:rgb(102,102,102)"></div><div class="nm">Gray 600</div><div class="lab">--text-secondary</div></div>
<div class="sw"><div class="chip" style="background:rgb(100,99,96)"></div><div class="nm">Stone 600</div><div class="lab">--text-link</div></div>
<div class="sw"><div class="chip" style="background:rgba(0,0,0,0.6)"></div><div class="nm">Ink 60%</div><div class="lab">--text-muted</div></div>
<div class="sw"><div class="chip" style="background:rgb(30,30,30)"></div><div class="nm">Gray 900</div><div class="lab">--icon-ink</div></div>
</div></body></html>
